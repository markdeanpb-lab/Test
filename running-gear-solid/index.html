<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RUNNING GEAR SOLID</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace; color: #7f7; }
  #stage { position: relative; }
  canvas#film { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: rgba(0,0,0,.75); display: flex; gap: 10px; align-items: center; font-size: 12px; }
  #controls input[type=range] { flex: 1; }
  #controls button { background: #111; color: #7f7; border: 1px solid #3a3; font-family: monospace; padding: 2px 10px; cursor: pointer; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="film" width="960" height="540"></canvas></div>
<div id="controls">
  <button id="play">PLAY</button>
  <span id="time">0:00.00</span>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" />
  <span id="seq"></span>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
